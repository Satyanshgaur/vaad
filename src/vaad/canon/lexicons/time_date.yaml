  2: [february, farwari, farvari, feb, फरवरी, फ़रवरी]
  3: [march, maarch, mar, मार्च]
  4: [april, aprail, apr, अप्रैल]
  5: [may, mai, मई]
  6: [june, joon, jun, जून]
  7: [july, julai, jul, जुलाई]
  8: [august, agast, aug, अगस्त]
  9: [september, sitambar, sep, sept, सितंबर, सितम्बर]
  10: [october, aktubar, oct, अक्टूबर, अक्तूबर]
  11: [november, navambar, nov, नवंबर, नवम्बर]
  12: [december, disambar, dec, दिसंबर, दिसम्बर]
weekdays:
  0: [somvaar, somwar, somvar, monday, सोमवार]
  1: [mangalvaar, mangalwar, mangalvar, tuesday, मंगलवार]
  2: [budhvaar, budhwar, budhvar, wednesday, बुधवार]
  3: [guruvaar, guruwar, guruvar, brihaspativaar, vrihaspativaar, thursday, गुरुवार, बृहस्पतिवार]
  4: [shukravaar, shukrawar, shukravar, friday, शुक्रवार]
  5: [shanivaar, shaniwar, shanivar, saturday, शनिवार]
  6: [ravivaar, raviwar, ravivar, itvaar, itwar, sunday, रविवार, इतवार]
# day offset from today; "direction" words are resolved by tense/field, see dates.py
relative_days:
  aaj: 0
  आज: 0
  kal: 1
  कल: 1
  parson: 2
  parso: 2
  परसों: 2
  narson: 3
  नरसों: 3
fixed_days: {tomorrow: 1, tmrw: 1, yesterday: -1, today: 0, tonight: 0, tonite: 0}
this_words: [this, is, iss, इस]
next_words: [agle, agla, agli, next, आगामी, अगले, अगला, अगली]
last_words: [pichhle, pichle, pichla, last, previous, पिछले, पिछला, पिछली, बीते]
day_words: [din, dino, दिन]
week_words: [hafte, haftey, hafta, saptah, हफ्ते, हफ़्ते, सप्ताह, हफ्ता]
after_words: [baad, bad, बाद, mein, में]
