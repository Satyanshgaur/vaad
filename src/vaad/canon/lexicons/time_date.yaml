tarikh_words: [tarikh, tareekh, taarikh, तारीख, तारीख़, तारिख]
# Tense cues in the clause around "kal": whole words, lower-case.
past_cues:
  # Plain past forms only. Resultative verbs (kiya, gaya, diya, li...) are left out on purpose: in
  # "alarm set kiya hai" they describe setting up a future event, and in MASSIVE train they
  # appeared only with "tomorrow".
  [tha, thi, the, thin, hua, hui, hue, suna, suni, dekha, dekhi, aaya, aayi, aaye, mila, mili,
