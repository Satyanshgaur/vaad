# Time, date and direction cues (Romanized Hinglish and Devanagari).
# Provenance: written by Claude (AI assistant) from general knowledge on 2026-10-31; developed and
# checked only against the MASSIVE hi-IN training partition (CC BY 4.0) and hand-made golden cases.
# NOT native-reviewed. Direction cues are heuristics, not grammar: see docs/ARCHITECTURE.md.
baje: [baje, bajke, bajey, bajkar, bajne, बजे, बजकर, बजने, बज]
fillers: [ko, ke, mein, me, tak, se, ki, ka, को, के, में, तक, से, की, का, aaj, आज]
periods:
