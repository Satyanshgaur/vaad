[project]
name = "vaad"
version = "0.0.1"
description = "OpenAI-compatible gateway that makes small local models produce correct tool calls from Hindi and Hinglish."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Satyansh Gaur" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Natural Language :: Hindi",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "jsonschema>=4.22",
    "dateparser>=1.2",
]

[project.scripts]
vaad = "vaad.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-benchmark>=4.0",
    "hypothesis>=6.100",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
    "types-jsonschema",
    "indic-transliteration>=2.3.82",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vaad"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["vaad", "harness"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
files = ["src", "harness"]
mypy_path = ["src", "."]
explicit_package_bases = true
warn_unused_configs = true
check_untyped_defs = true

# Gate 2: strict typing where a silent type bug changes a value.
[[tool.mypy.overrides]]
module = ["vaad.canon.*", "vaad.router.*", "vaad.grammar.*"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_any_generics = true
disallow_untyped_calls = true
warn_return_any = true
no_implicit_reexport = true
strict_equality = true

[[tool.mypy.overrides]]
module = ["indic_transliteration.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "unit: fast, no network or model",
    "golden: fixed input -> expected canonicalization pairs (gate 4)",
    "property: hypothesis property tests (gate 5)",
    "integration: proxy contract with a mocked backend (gate 7)",
    "smoke: tiny-model eval on CPU (gate 9)",
]

[tool.coverage.run]
source = ["vaad"]
branch = true
