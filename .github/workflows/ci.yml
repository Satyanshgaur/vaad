name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked

      - name: "Gate 1: lint and format"
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: "Gate 2: types (strict on canon/, router/, grammar/)"
        run: uv run mypy

      - name: "Gate 3: unit tests"
        # Coverage gate on vaad.canon (--cov-fail-under=90) switches on in Phase 2.
        run: uv run pytest tests/unit -m unit --cov=vaad --cov-report=term-missing

      - name: "Gates 4 and 6: golden canonicalization cases"
        run: uv run pytest tests/golden -m golden

      - name: "Gates 5 and 6: property tests (round trips, free text untouched, spans)"
        run: uv run pytest tests/property -m property

      - name: "Gate 7: proxy contract (mocked backend)"
        run: uv run pytest tests/integration -m integration

      - name: "Gate 10: leakage guard"
        run: uv run python -m harness.leakage

      - name: "Split lock unchanged"
        if: hashFiles('harness/tasks/SPLITS.lock') != ''
        run: uv run python -m harness.split check harness/tasks --allow-missing test/

  # Gates switched on by later phases:
  #   8 latency budget           -> Phase 2: pytest-benchmark, p95 < 20 ms / 1k canonicalizations
  #   9 smoke eval               -> Phase 1: 50 dev tasks, tiny model on CPU, 1 seed
